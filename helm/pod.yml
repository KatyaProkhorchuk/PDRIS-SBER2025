apiVersion: v1
kind: Pod
metadata:
  name: custom-app-pod
spec:
  containers:
    - name: custom-app
      image: custom-app
      imagePullPolicy: Never 
      ports:
        - containerPort: 5000
      volumeMounts:
        - name: logs-volume
          mountPath: /app/logs
  volumes:
    - name: logs-volume
      emptyDir: {}