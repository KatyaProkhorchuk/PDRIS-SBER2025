apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: log-agent
spec:
  selector:
    matchLabels:
      app: log-agent
  template:
    metadata:
      labels:
        app: log-agent
    spec:
      containers:
      - name: log-collector
        image: busybox:1.35
        command: ["sh", "-c"]
        args:
          - |
            while true; do
              find /var/log/app-logs -name app.log -type f 2>/dev/null | while read logfile; do
                pod_name=$(echo "$logfile" | awk -F'/' '{print $(NF-1)}')
                echo "Tailing $logfile (Pod: $pod_name)"
                tail -n+1 -F "$logfile" | while read line; do
                  echo "[$pod_name] $line"
                done
              done
              sleep 5
            done
        volumeMounts:
        - name: app-logs
          mountPath: /var/log/app-logs
          readOnly: true
      volumes:
      - name: app-logs
        hostPath:
          path: /var/log/app-logs
          type: Directory