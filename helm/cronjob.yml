apiVersion: batch/v1
kind: CronJob
metadata:
  name: log-archiver
spec:
  schedule: "*/10 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: archiver
            image: alpine:latest
            command: ["sh", "-c"]
            args:
              - |
                TIMESTAMP=$(date +"%Y%m%d%H%M%S")
                mkdir -p /tmp/logs-to-archive
                
                cp /shared-logs/app.log /tmp/logs-to-archive/
                
                tar -czf /tmp/app-logs-${TIMESTAMP}.tar.gz -C /tmp/logs-to-archive .
                echo "Archive created: $(ls -lh /tmp/*.tar.gz)"
                sleep 300 # что б проверить
            volumeMounts:
            - name: shared-logs
              mountPath: /shared-logs
          volumes:
          - name: shared-logs
            hostPath:
              path: /var/log/app-logs/$(POD_NAME)
              type: Directory
          restartPolicy: OnFailure